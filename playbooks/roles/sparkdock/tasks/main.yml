---
# Other roles read scripts from the checkout, so it must exist on every run,
# but a run limited to unrelated tags must not move it or discard local edits.
- name: Ensure sparkdock repository is cloned
  tags: [always]
  become: true
  become_user: "{{ system.username | default(current_user) }}"
  block:
    - name: Clone sparkdock when missing
      ansible.builtin.git:
        repo: "https://github.com/sparkfabrik/sparkdock.git"
        dest: "{{ sparkdock.path | default(sparkdock_default_path) }}"
        version: master
        update: false

- name: Update the sparkdock checkout
  tags: [sparkfabrik, sparkdock, sf-toolbox]
  become: true
  become_user: "{{ system.username | default(current_user) }}"
  block:
    - name: Git checkout sparkdock
      ansible.builtin.git:
        repo: "https://github.com/sparkfabrik/sparkdock.git"
        dest: "{{ sparkdock.path | default(sparkdock_default_path) }}"
        version: master
        update: true
        force: true

# Managed Claude Code settings are shared with macOS and load the
# `sparkfabrik-harness` plugin from `/opt/sparkdock`, so the same path must
# resolve here. An existing directory at that path is left untouched.
- name: Link `/opt/sparkdock` to the sparkdock checkout
  when: sparkfabrik | default(true)
  tags: [sparkfabrik, sparkdock, claude-mods]
  become: true
  block:
    - name: Check `/opt/sparkdock`
      ansible.builtin.stat:
        path: /opt/sparkdock
      register: opt_sparkdock

    - name: Create the `/opt/sparkdock` symlink
      ansible.builtin.file:
        src: "{{ sparkdock.path | default(sparkdock_default_path) }}"
        dest: /opt/sparkdock
        state: link
        force: true
      when: not opt_sparkdock.stat.exists or opt_sparkdock.stat.islnk

    - name: Warn that `/opt/sparkdock` is not a symlink
      ansible.builtin.debug:
        msg: "`/opt/sparkdock` exists and is not a symlink, so the Claude Code `sparkfabrik-harness` plugin may load an outdated copy. Remove it and run `TAGS=claude-mods sf-toolbox`."
      when: opt_sparkdock.stat.exists and not opt_sparkdock.stat.islnk

- name: Sync AI coding agent resources from upstream repository
  when: sparkfabrik | default(true)
  tags: [sparkfabrik, sparkdock, ai-coding-agents]
  block:
    - name: Ensure agent cache directory exists
      become: yes
      become_user: "{{ system.username | default(current_user) }}"
      ansible.builtin.file:
        path: "{{ system.home | default(current_home) }}/.cache/sparkdock"
        state: directory
        mode: "0755"

    - name: Make sparkdock bin scripts executable
      become: yes
      ansible.builtin.shell: chmod +x "{{ sparkdock.path | default(sparkdock_default_path) }}/bin/"*
      changed_when: false

    - name: Run agent resources sync
      become: yes
      become_user: "{{ system.username | default(current_user) }}"
      ansible.builtin.shell: |
        # Wrap gum to skip TTY-dependent subcommands (spin) in non-interactive Ansible context.
        export _REAL_GUM=$(command -v gum)
        gum() {
          if [[ "$1" == "spin" ]]; then
            shift
            # Skip all arguments until the '--' separator.
            while [[ $# -gt 0 && "$1" != "--" ]]; do shift; done
            # Skip the '--' separator itself.
            [[ "${1:-}" == "--" ]] && shift
            "$@"
          else
            "$_REAL_GUM" "$@"
          fi
        }
        export -f gum
        {{ sparkdock.path | default(sparkdock_default_path) }}/bin/sparkdock-agents-sync
      args:
        executable: /bin/bash
      register: agents_sync_output
      changed_when: "'added' in agents_sync_output.stdout or 'updated' in agents_sync_output.stdout"

    - name: Show agent resources sync output
      ansible.builtin.debug:
        msg: "{{ agents_sync_output.stdout_lines }}"
      when: agents_sync_output.stdout_lines | length > 0
