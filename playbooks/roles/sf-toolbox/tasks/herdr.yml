---
- name: Install herdr from GitHub releases (Archlinux)
  tags: [sf-toolbox, packages, herdr]
  when: ansible_facts['os_family'] == "Archlinux"
  block:
    # Omarchy ships herdr as a pacman package (/usr/bin/herdr) and keeps it
    # current through `omarchy update`. A GitHub-release copy in
    # /usr/local/bin would shadow the packaged binary and drift silently, so
    # when the package is present we remove our copy and delegate to pacman.
    - name: Check whether herdr is installed via pacman
      ansible.builtin.command: pacman -Q herdr
      register: herdr_pacman
      changed_when: false
      failed_when: false

    - name: Remove the GitHub-release herdr shadowing the packaged one
      ansible.builtin.file:
        path: /usr/local/bin/herdr
        state: absent
      when: herdr_pacman.rc == 0

    - name: Install herdr from GitHub releases
      when: herdr_pacman.rc != 0
      block:
        - name: Check if herdr is installed
          ansible.builtin.command: /usr/local/bin/herdr --version
          register: herdr_installed
          changed_when: false
          failed_when: false

        - name: Get latest herdr release version from GitHub
          ansible.builtin.uri:
            url: https://api.github.com/repos/ogulcancelik/herdr/releases/latest
            return_content: true
            headers:
              Accept: application/vnd.github.v3+json
          register: herdr_latest_release
          changed_when: false

        - name: Set herdr version facts
          ansible.builtin.set_fact:
            herdr_current_version: "{{ herdr_installed.stdout | default('') | regex_replace('^herdr\\s+', '') }}"
            herdr_latest_version: "{{ herdr_latest_release.json.tag_name | regex_replace('^v', '') }}"

        - name: Fail on unsupported architecture for herdr
          ansible.builtin.fail:
            msg: "herdr does not provide a binary for architecture: {{ ansible_facts['architecture'] }}"
          when: ansible_facts['architecture'] not in ['x86_64', 'aarch64']

        - name: Notify herdr fresh installation
          ansible.builtin.debug:
            msg: "herdr is not installed, installing version {{ herdr_latest_version }}"
          when: herdr_installed.rc != 0

        - name: Notify herdr version upgrade
          ansible.builtin.debug:
            msg: "herdr {{ herdr_current_version }} is outdated, upgrading to {{ herdr_latest_version }}"
          when:
            - herdr_installed.rc == 0
            - herdr_current_version != herdr_latest_version

        - name: Notify herdr is up to date
          ansible.builtin.debug:
            msg: "herdr {{ herdr_current_version }} is already the latest version"
          when:
            - herdr_installed.rc == 0
            - herdr_current_version == herdr_latest_version

        - name: Download herdr binary
          ansible.builtin.get_url:
            url: "https://github.com/ogulcancelik/herdr/releases/download/v{{ herdr_latest_version }}/herdr-linux-{{ ansible_facts['architecture'] }}"
            dest: /usr/local/bin/herdr
            mode: "0755"
          when:
            - herdr_installed.rc != 0 or herdr_current_version != herdr_latest_version

        - name: Verify herdr installation
          ansible.builtin.command: /usr/local/bin/herdr --version
          changed_when: false
          when:
            - herdr_installed.rc != 0 or herdr_current_version != herdr_latest_version

- name: Install herdr via Homebrew (Debian/Ubuntu)
  tags: [sf-toolbox, packages, herdr]
  when: ansible_facts['os_family'] == "Debian"
  become: true
  become_user: "{{ system.username | default(current_user) }}"
  block:
    - name: Install herdr via Homebrew
      community.general.homebrew:
        name: herdr
        state: latest
        path: /home/linuxbrew/.linuxbrew/bin

# Arch Linux needs a generated completion for both providers: the Omarchy
# pacman package installs only the binary and its license, and the
# GitHub-release install is a bare binary. On Debian/Ubuntu the Homebrew
# formula ships _herdr in its own share/zsh/site-functions (already on the
# fpath via `brew shellenv` in ~/.zshrc), so a generated copy would shadow
# it and drift.
- name: Install the herdr zsh completion
  tags: [sf-toolbox, packages, herdr]
  when: ansible_facts['os_family'] == "Archlinux"
  block:
    - name: Ensure zsh site-functions directory exists
      ansible.builtin.file:
        path: "{{ system.home | default(current_home) }}/.local/share/zsh/site-functions"
        state: directory
        mode: "0755"
        owner: "{{ system.username | default(current_user) }}"
        group: "{{ system.username | default(current_user) }}"

    - name: Generate herdr zsh completion
      become: true
      become_user: "{{ system.username | default(current_user) }}"
      ansible.builtin.command: "{{ '/usr/bin/herdr' if herdr_pacman.rc == 0 else '/usr/local/bin/herdr' }} completion zsh"
      register: herdr_completion_output
      changed_when: false

    - name: Write herdr completions to file
      ansible.builtin.copy:
        content: "{{ herdr_completion_output.stdout }}\n"
        dest: "{{ system.home | default(current_home) }}/.local/share/zsh/site-functions/_herdr"
        mode: "0644"
        owner: "{{ system.username | default(current_user) }}"
        group: "{{ system.username | default(current_user) }}"

# The Herdr desktop app is a separate program from the TUI above, built on
# herdr-core; the two keep their own agents and can be installed together.
# Herdr's own installer puts the app in ~/.local/share/herdr-app with a
# launcher entry, after checking the download against the release manifest's
# sha256. The app adds herdr-core only on its first launch, so the next block
# installs it. The app updates itself and its core from then on, so the
# installer runs only once,
# as the desktop user, the same way Omarchy's `omarchy-install-ai-herdr` does.
- name: Install the Herdr desktop app
  tags: [sf-toolbox, packages, herdr, herdr-app]
  when: ansible_facts['architecture'] in ['x86_64', 'aarch64']
  vars:
    herdr_app_user: "{{ system.username | default(current_user) }}"
    herdr_app_home: "{{ system.home | default(current_home) }}"
  block:
    # A machine without a desktop session (a server, a container) has no use
    # for a desktop app.
    - name: Look for a graphical session
      ansible.builtin.find:
        paths: [/usr/share/wayland-sessions, /usr/share/xsessions]
        patterns: "*.desktop"
      register: herdr_app_sessions

    - name: Check for an installed Herdr desktop app
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ herdr_app_home }}/.local/share/herdr-app"
        - /usr/bin/herdr-app
      register: herdr_app_installed

    - name: Report the Herdr desktop app skipped without a desktop session
      ansible.builtin.debug:
        msg: The Herdr desktop app is skipped because this machine has no graphical session
      when: herdr_app_sessions.matched == 0

    - name: Run the Herdr desktop app installer
      when:
        - herdr_app_sessions.matched > 0
        - herdr_app_installed.results | selectattr('stat.exists') | list | length == 0
      block:
        - name: Create a temporary file for the Herdr installer
          ansible.builtin.tempfile:
            state: file
            suffix: .herdr-app-install.sh
          register: herdr_app_installer

        # Downloaded whole before it runs, so a dropped connection can never
        # run half a script.
        - name: Download the Herdr installer
          ansible.builtin.get_url:
            url: https://releases.herdr.dev/app/install.sh
            dest: "{{ herdr_app_installer.path }}"
            mode: "0644"
            force: true

        - name: Install the Herdr desktop app
          become: true
          become_user: "{{ herdr_app_user }}"
          ansible.builtin.command:
            argv: [sh, "{{ herdr_app_installer.path }}"]
          environment:
            HOME: "{{ herdr_app_home }}"
          changed_when: true
      always:
        - name: Remove the Herdr installer
          ansible.builtin.file:
            path: "{{ herdr_app_installer.path }}"
            state: absent
          when: herdr_app_installer.path is defined

# The Herdr app installs herdr-core (hc) only on its first launch, so a fresh
# machine has no hc and the herdr skill setup below writes no hc manual.
# Install it once with the upstream installer, which checks the sha256.
# Updates are left to the app and `hc update`.
- name: Install herdr-core for the Herdr desktop app
  tags: [sf-toolbox, packages, herdr, herdr-app]
  vars:
    herdr_core_user: "{{ system.username | default(current_user) }}"
    herdr_core_home: "{{ system.home | default(current_home) }}"
  block:
    - name: Check whether the Herdr desktop app is installed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ herdr_core_home }}/.local/share/herdr-app"
        - /usr/bin/herdr-app
      register: herdr_core_app_installed

    - name: Check whether herdr-core is installed
      become: true
      become_user: "{{ herdr_core_user }}"
      ansible.builtin.shell: |
        for candidate in "$(command -v hc)" "$(command -v herdr-core)" \
          "${HOME}/.local/bin/hc" "${HOME}/.local/bin/herdr-core"; do
          if [ -x "${candidate}" ] && "${candidate}" --version 2>/dev/null | grep -q '^hc '; then
            exit 0
          fi
        done
        exit 1
      environment:
        HOME: "{{ herdr_core_home }}"
      register: herdr_core_installed
      changed_when: false
      failed_when: false
      when: herdr_core_app_installed.results | selectattr('stat.exists') | list | length > 0

    - name: Run the herdr-core installer
      when:
        - herdr_core_app_installed.results | selectattr('stat.exists') | list | length > 0
        - herdr_core_installed.rc != 0
      block:
        - name: Create a temporary file for the herdr-core installer
          ansible.builtin.tempfile:
            state: file
            suffix: .herdr-core-install.sh
          register: herdr_core_installer

        # Downloaded whole before it runs, so a dropped connection can never
        # run half a script.
        - name: Download the herdr-core installer
          ansible.builtin.get_url:
            url: https://releases.herdr.dev/core/install.sh
            dest: "{{ herdr_core_installer.path }}"
            mode: "0644"
            force: true

        - name: Install herdr-core
          become: true
          become_user: "{{ herdr_core_user }}"
          ansible.builtin.command:
            argv: [sh, "{{ herdr_core_installer.path }}"]
          environment:
            HOME: "{{ herdr_core_home }}"
          changed_when: true
      rescue:
        - name: Report the failed herdr-core install
          ansible.builtin.debug:
            msg: Installing herdr-core failed; the herdr skill setup prints how to finish it
      always:
        - name: Remove the herdr-core installer
          ansible.builtin.file:
            path: "{{ herdr_core_installer.path }}"
            state: absent
          when: herdr_core_installer.path is defined

- name: Configure the herdr agent skill
  tags: [sf-toolbox, packages, herdr, herdr-app, ai-harness]
  block:
    - name: Check if herdr skill setup script exists and is executable
      become: true
      become_user: "{{ system.username | default(current_user) }}"
      ansible.builtin.stat:
        path: "{{ sparkdock.path | default(sparkdock_default_path) }}/sjust/scripts/herdr/setup.sh"
      register: herdr_skill_setup_script

    - name: Run herdr skill setup script
      become: true
      become_user: "{{ system.username | default(current_user) }}"
      # argv form so a sparkdock.path containing spaces stays one argument.
      ansible.builtin.command:
        argv:
          - "{{ sparkdock.path | default(sparkdock_default_path) }}/sjust/scripts/herdr/setup.sh"
      when:
        - herdr_skill_setup_script.stat.exists
        - herdr_skill_setup_script.stat.executable | default(false)
      changed_when: true

    - name: Warn user to manually run herdr skill setup
      ansible.builtin.debug:
        msg: >-
          WARNING: Automatic herdr skill installation was not possible.
          Please run `ajust sf-herdr-skill-install` manually to complete the setup.
      when: not herdr_skill_setup_script.stat.exists or not (herdr_skill_setup_script.stat.executable | default(false))

# The SparkFabrik layout for the Herdr desktop app comes from sparkdock, like
# the herdr skill above: the shared script copies the layout, its light and
# dark themes and its mods into the app's home, and selects the layout once per
# machine, so a person who switches back keeps that choice. When the app is
# installed but was never opened, the script creates its home first; it skips
# cleanly when the app is not installed.
- name: Install the SparkFabrik layout for the Herdr desktop app
  tags: [sf-toolbox, packages, herdr, herdr-app, herdr-layout]
  block:
    - name: Check if the herdr-app layout setup script exists and is executable
      become: true
      become_user: "{{ system.username | default(current_user) }}"
      ansible.builtin.stat:
        path: "{{ sparkdock.path | default(sparkdock_default_path) }}/sjust/scripts/herdr-app/setup.sh"
      register: herdr_layout_setup_script

    - name: Run the herdr-app layout setup script
      become: true
      become_user: "{{ system.username | default(current_user) }}"
      # argv form so a sparkdock.path containing spaces stays one argument.
      ansible.builtin.command:
        argv:
          - "{{ sparkdock.path | default(sparkdock_default_path) }}/sjust/scripts/herdr-app/setup.sh"
          # `provision` respects an earlier `ajust herdr-layout-uninstall`.
          - provision
      register: herdr_layout_setup
      when:
        - herdr_layout_setup_script.stat.exists
        - herdr_layout_setup_script.stat.executable | default(false)
      changed_when: "'SparkFabrik layout installed' in (herdr_layout_setup.stdout + herdr_layout_setup.stderr)"

    - name: Warn user to manually install the SparkFabrik herdr-app layout
      ansible.builtin.debug:
        msg: >-
          WARNING: The SparkFabrik layout for the Herdr desktop app could not be installed automatically.
          Please run `ajust herdr-layout-install` manually once sparkdock includes it.
      when: not herdr_layout_setup_script.stat.exists or not (herdr_layout_setup_script.stat.executable | default(false))
