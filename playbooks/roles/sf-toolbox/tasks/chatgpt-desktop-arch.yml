---
- name: Read pacman configuration before enabling OpenAI
  ansible.builtin.slurp:
    src: /etc/pacman.conf
  register: chatgpt_pacman_configuration

- name: List configured pacman repositories
  ansible.builtin.command: pacman-conf --repo-list
  register: chatgpt_pacman_repositories
  changed_when: false

- name: Reject a conflicting OpenAI repository definition
  ansible.builtin.assert:
    that:
      - >-
        'openai-chatgpt' not in chatgpt_pacman_repositories.stdout_lines
        or (chatgpt_pacman_configuration.content | b64decode) is search('(?m)^Include = /etc/pacman.d/openai-chatgpt.conf$')
      - (chatgpt_pacman_configuration.content | b64decode) is not search('(?m)^\s*\[openai-chatgpt\]')
    fail_msg: Move the existing OpenAI repository definition to /etc/pacman.d/openai-chatgpt.conf before retrying

- name: Install the pinned OpenAI public key
  ansible.builtin.copy:
    src: openai-chatgpt.asc
    dest: /usr/share/pacman/keyrings/openai-chatgpt.asc
    mode: "0644"
  register: chatgpt_repository_key

- name: Check whether the OpenAI key is imported
  ansible.builtin.command: pacman-key --list-keys 3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4
  register: chatgpt_repository_imported
  changed_when: false
  failed_when: false

- name: Import the pinned OpenAI key
  ansible.builtin.command: pacman-key --add /usr/share/pacman/keyrings/openai-chatgpt.asc
  when: chatgpt_repository_key.changed or chatgpt_repository_imported.rc != 0

- name: Inspect OpenAI key validity
  ansible.builtin.command:
    argv: [gpg, --homedir, /etc/pacman.d/gnupg, --batch, --with-colons, --list-keys, 3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4]
  register: chatgpt_repository_validity
  changed_when: false

- name: Locally trust the pinned OpenAI key
  ansible.builtin.command: pacman-key --lsign-key 3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4
  when: chatgpt_repository_validity.stdout is not search('(?m)^pub:[fu]:')

- name: Configure the official OpenAI Arch repository
  ansible.builtin.copy:
    dest: /etc/pacman.d/openai-chatgpt.conf
    mode: "0644"
    content: |
      ### THIS FILE IS AUTOMATICALLY CONFIGURED ###
      # Remove it and its Include line to opt out of automatic package updates.
      [openai-chatgpt]
      SigLevel = Required DatabaseRequired TrustedOnly
      Server = https://persistent.oaistatic.com/codex-app-prod/linux/arch/$arch

- name: Enable the official OpenAI Arch repository
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    line: Include = /etc/pacman.d/openai-chatgpt.conf

- name: Fully upgrade Arch before installing ChatGPT desktop
  community.general.pacman:
    update_cache: true
    upgrade: true
  register: chatgpt_system_upgrade
  changed_when: chatgpt_system_upgrade.packages | default([]) | length > 0

- name: Install the official desktop and replace conflicting legacy packages
  community.general.pacman:
    name: openai-chatgpt/chatgpt-bin
    state: present
    # ALPM_QUESTION_CONFLICT_PKG: let pacman replace the detected legacy provider.
    extra_args: "{{ '--ask=4' if chatgpt_legacy_packages.stdout_lines | intersect(['chatgpt-desktop', 'chatgpt', 'openai-codex-desktop']) | length > 0 else '' }}"

- name: Verify legacy desktop packages were replaced
  ansible.builtin.command: pacman -Qq
  register: chatgpt_remaining_legacy
  changed_when: false
  failed_when: >-
    chatgpt_remaining_legacy.rc != 0
    or chatgpt_remaining_legacy.stdout_lines | intersect(['chatgpt-desktop', 'chatgpt', 'openai-codex-desktop']) | length > 0
