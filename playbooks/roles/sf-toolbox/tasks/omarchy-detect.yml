---
# Omarchy manages a set of dev tools itself: mise wrappers in ~/.local/bin
# (generated by omarchy-mise-install, regenerated on every `omarchy update`)
# plus its own pacman packages. Installing the same tools from sf-toolbox
# creates two updaters for one binary, and omarchy migrations would revert any
# competing install anyway. Detect what Omarchy owns so later tasks delegate:
# one tool, one owner.
- name: Detect Omarchy-managed tooling
  tags: [always]
  block:
    - name: Check for an Omarchy installation
      ansible.builtin.stat:
        path: /usr/share/omarchy
      register: omarchy_install_stat

    - name: Default the Omarchy ownership facts
      ansible.builtin.set_fact:
        omarchy_detected: "{{ omarchy_install_stat.stat.exists }}"
        omarchy_mise_tools: []
        omarchy_shadowed_pacman: []
        omarchy_shadowed_npm: []

    - name: Detect Omarchy mise-managed tools
      when: omarchy_detected
      block:
        - name: List the mise wrappers in the user bin directory
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.shell:
            cmd: grep -l 'mise use -g' "{{ system.home | default(current_home) }}/.local/bin/"* 2>/dev/null | xargs -r -n1 basename
          register: omarchy_mise_wrappers
          changed_when: false
          failed_when: false

        - name: Record the Omarchy-owned tools
          ansible.builtin.set_fact:
            omarchy_mise_tools: "{{ omarchy_mise_wrappers.stdout_lines | default([]) }}"

        # Packages sf-toolbox would otherwise install that ship the same
        # binaries Omarchy already manages via mise.
        - name: Record the packages shadowed by Omarchy
          ansible.builtin.set_fact:
            omarchy_shadowed_pacman: >-
              {{ (['github-cli'] if 'gh' in omarchy_mise_tools else [])
               + (['opencode'] if 'opencode' in omarchy_mise_tools else []) }}
            omarchy_shadowed_npm: "{{ ['@github/copilot'] if 'copilot' in omarchy_mise_tools else [] }}"
