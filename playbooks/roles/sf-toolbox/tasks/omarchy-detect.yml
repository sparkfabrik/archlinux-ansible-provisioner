---
# Omarchy manages a set of dev tools itself: mise wrappers in ~/.local/bin
# (generated by omarchy-mise-install, regenerated on every `omarchy update`)
# plus its own pacman packages. Installing the same tools from sf-toolbox
# creates two updaters for one binary, and omarchy migrations would revert any
# competing install anyway. Detect what Omarchy owns so later tasks delegate:
# one tool, one owner.
- name: Detect Omarchy-managed tooling
  tags: [always]
  block:
    # Omarchy is not a distribution Ansible knows: it reads /etc/arch-release
    # and reports Archlinux, so ansible_distribution cannot single it out the
    # way it singles out Ubuntu or Arch. Two signals do, and either is enough.
    # os-release carries ID=omarchy on a machine installed from an Omarchy
    # image, and the installation directory is present both there and on an
    # Omarchy installed over an existing Arch, where os-release keeps saying
    # arch.
    #
    # omarchy_detected is the one control every Omarchy task gates on. Do not
    # add another stat elsewhere: this block carries the always tag, so the
    # fact is set even when a single tag is requested.
    - name: Look for the Omarchy installation directory
      ansible.builtin.stat:
        path: /usr/share/omarchy
      register: omarchy_install_stat

    - name: Read the distribution identity
      ansible.builtin.slurp:
        src: /etc/os-release
      register: omarchy_os_release
      failed_when: false

    - name: Default the Omarchy ownership facts
      ansible.builtin.set_fact:
        omarchy_detected: >-
          {{ omarchy_install_stat.stat.exists
             or ((omarchy_os_release.content | default('') | b64decode)
                 is search('(?m)^ID="?omarchy"?$')) }}
        omarchy_mise_tools: []
        omarchy_shadowed_pacman: []
        omarchy_shadowed_npm: []

    - name: Detect Omarchy mise-managed tools
      when: omarchy_detected
      block:
        # Every omarchy-* command reads OMARCHY_PATH, which Omarchy exports
        # from /etc/profile.d and the bash rc chain. Ansible runs neither, so
        # the tasks that call those commands pass it themselves.
        # /etc/omarchy.conf holds the override omarchy-dev-link writes; a
        # packaged install has no such file and lives at the default path.
        - name: Read the Omarchy path override
          ansible.builtin.slurp:
            src: /etc/omarchy.conf
          register: omarchy_conf
          failed_when: false

        - name: Record the Omarchy installation path
          ansible.builtin.set_fact:
            omarchy_path: "{{ omarchy_conf_path | default('/usr/share/omarchy', true) }}"
          vars:
            omarchy_conf_path: >-
              {{ ((omarchy_conf.content | default('') | b64decode)
                  | regex_search('(?m)^OMARCHY_PATH=(.+)$', '\1')
                  | default([], true) | join(''))
                 | regex_replace('["\x27]', '') | trim }}

        - name: List the mise wrappers in the user bin directory
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.shell:
            cmd: grep -l 'mise use -g' "{{ system.home | default(current_home) }}/.local/bin/"* 2>/dev/null | xargs -r -n1 basename
          register: omarchy_mise_wrappers
          changed_when: false
          failed_when: false

        - name: Record the Omarchy-owned tools
          ansible.builtin.set_fact:
            omarchy_mise_tools: "{{ omarchy_mise_wrappers.stdout_lines | default([]) }}"

        # Packages sf-toolbox would otherwise install that ship the same
        # binaries Omarchy already manages via mise.
        - name: Record the packages shadowed by Omarchy
          ansible.builtin.set_fact:
            omarchy_shadowed_pacman: >-
              {{ (['github-cli'] if 'gh' in omarchy_mise_tools else [])
               + (['opencode'] if 'opencode' in omarchy_mise_tools else [])
               + (['openai-codex'] if 'codex' in omarchy_mise_tools else []) }}
            omarchy_shadowed_npm: "{{ ['@github/copilot'] if 'copilot' in omarchy_mise_tools else [] }}"
