---
- name: Detect Omarchy-managed tooling
  import_tasks: omarchy-detect.yml

- name: Configure SparkFabrik package sources
  ansible.builtin.import_role:
    name: sparkfabrik-repository
  vars:
    sparkfabrik_arch_pkgbuilds: "{{ sf_toolbox_arch_pkgbuilds | default(true) }}"
  when: ansible_facts['architecture'] == 'x86_64'
  tags: [sf-toolbox, packages, ai, chatgpt-desktop]

- name: Bootstrap Homebrew
  import_tasks: homebrew.yml

- name: Install toolbox packages
  import_tasks: packages.yml

- name: Install Google Cloud SDK
  import_tasks: gcloud.yml

- name: Configure glab
  import_tasks: glab.yml

- name: Setup ajust
  import_tasks: ajust.yml

- name: Install SparkFabrik HTTP Proxy
  import_tasks: http-proxy.yml

- name: Configure AI tools
  import_tasks: ai.yml

- name: Install ChatGPT desktop
  ansible.builtin.import_tasks: chatgpt-desktop.yml

- name: Install rtk
  import_tasks: rtk.yml

- name: Install herdr
  import_tasks: herdr.yml

- name: Install Upterm
  import_tasks: upterm.yml

- name: Configure caveman
  import_tasks: caveman.yml

- name: Configure Claude gh skill gate
  import_tasks: claude-gh-gate.yml

- name: Configure the default Claude Code output style
  import_tasks: claude-output-style.yml

- name: Install the Omarchy bar widget
  import_tasks: omarchy-bar.yml

- name: Install the Omarchy theme
  import_tasks: omarchy-theme.yml
