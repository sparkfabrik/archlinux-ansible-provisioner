---
- name: Detect Omarchy-managed tooling
  import_tasks: omarchy-detect.yml

- name: Configure SparkFabrik package sources
  ansible.builtin.import_role:
    name: sparkfabrik-repository
  vars:
    sparkfabrik_arch_pkgbuilds: "{{ sf_toolbox_arch_pkgbuilds | default(true) }}"
    sparkfabrik_arch_repo: "{{ sf_toolbox_arch_repo | default(true) }}"
  when: ansible_facts['architecture'] == 'x86_64'
  tags: [sf-toolbox, packages, ai, chatgpt-desktop]

- name: Bootstrap Homebrew
  import_tasks: homebrew.yml

- name: Install toolbox packages
  import_tasks: packages.yml

- name: Update the running Codex daemon to the public stable release
  tags: [sf-toolbox, packages]
  become: true
  become_user: "{{ system.username | default(current_user) }}"
  vars:
    codex_daemon_cli: "{{ '/usr/bin/codex' if ansible_facts['os_family'] == 'Archlinux' else '/home/linuxbrew/.linuxbrew/bin/codex' }}"
  environment:
    HOME: "{{ system.home | default(current_home) }}"
  when:
    - not ansible_check_mode
    - "'codex' not in (omarchy_mise_tools | default([]))"
  block:
    - name: Check the Codex daemon version
      ansible.builtin.command:
        argv: ["{{ codex_daemon_cli }}", app-server, daemon, version]
      register: codex_daemon_version
      changed_when: false
      failed_when: false

    - name: Install the public stable Codex daemon and verify the running version
      ansible.builtin.command:
        argv: ["{{ codex_daemon_cli }}", app-server, daemon, update]
      register: codex_daemon_update
      vars:
        codex_daemon_result: "{{ codex_daemon_update.stdout | from_json }}"
        codex_daemon_status: "{{ codex_daemon_version.stdout | from_json }}"
      changed_when: codex_daemon_update.rc == 0 and codex_daemon_result.status == 'updated'
      failed_when: >-
        codex_daemon_update.rc != 0
        or codex_daemon_result.status not in ['updated', 'noUpdate']
        or codex_daemon_result.runningVersion != codex_daemon_result.installedVersion
      when:
        - codex_daemon_version.rc == 0
        - codex_daemon_status.status == 'running'
        - codex_daemon_status.managedCodexVersion | default(none) is not none
        - codex_daemon_status.appServerVersion is version(codex_daemon_status.cliVersion, '<', version_type='semver')
  rescue:
    - name: Report the Codex daemon update failure
      ansible.builtin.debug:
        msg: >-
          Could not verify the Codex daemon update. Check the failed task output
          and run `codex app-server daemon update` after active Codex work finishes.

- name: Configure PHP
  ansible.builtin.import_tasks: php.yml

- name: Install Google Cloud SDK
  import_tasks: gcloud.yml

- name: Configure glab
  import_tasks: glab.yml

- name: Setup ajust
  import_tasks: ajust.yml

- name: Install SparkFabrik HTTP Proxy
  import_tasks: http-proxy.yml

- name: Configure AI tools
  import_tasks: ai.yml

- name: Install ChatGPT desktop
  ansible.builtin.import_tasks: chatgpt-desktop.yml

- name: Install rtk
  import_tasks: rtk.yml

- name: Install claude-usage
  import_tasks: claude-usage.yml

- name: Install herdr
  import_tasks: herdr.yml

- name: Install Upterm
  import_tasks: upterm.yml

- name: Configure caveman
  import_tasks: caveman.yml

- name: Configure Claude gh skill gate
  import_tasks: claude-gh-gate.yml

- name: Configure the default Claude Code output style
  import_tasks: claude-output-style.yml

- name: Install the Omarchy bar widget
  import_tasks: omarchy-bar.yml

- name: Install the Omarchy theme
  import_tasks: omarchy-theme.yml
