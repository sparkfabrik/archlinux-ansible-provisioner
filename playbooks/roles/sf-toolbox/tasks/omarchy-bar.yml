---
- name: Install the SparkFabrik Omarchy bar widget
  tags: [sf-toolbox, omarchy-bar]
  vars:
    plugin_dir: "{{ system.home | default(current_home) }}/.config/omarchy/plugins/sparkfabrik.toolbox"
  block:
    - name: Check for an Omarchy installation
      ansible.builtin.stat:
        path: /usr/share/omarchy
      register: omarchy_install

    - name: Install the Omarchy bar widget and its status backend
      when: omarchy_install.stat.exists
      block:
        - name: Install the sf-toolbox-status update checker
          ansible.builtin.copy:
            src: omarchy-bar/sf-toolbox-status
            dest: /usr/local/bin/sf-toolbox-status
            mode: "0755"

        # Which GitLab groups hold one subgroup per client is deployment
        # specific, so it lives in the user's config rather than in this repo.
        # Set sf_toolbox_gitlab_client_groups (a list of top-level group paths)
        # from a private inventory or with --extra-vars. Left unset, Mission
        # Control names every project after the project itself.
        - name: Create the toolbox configuration directory
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.file:
            path: "{{ system.home | default(current_home) }}/.config/sparkfabrik-toolbox"
            state: directory
            mode: "0755"
          when: sf_toolbox_gitlab_client_groups | default([]) | length > 0

        - name: Record the GitLab client groups for Mission Control
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.lineinfile:
            path: "{{ system.home | default(current_home) }}/.config/sparkfabrik-toolbox/config"
            regexp: "^SF_GITLAB_CLIENT_GROUPS="
            line: "SF_GITLAB_CLIENT_GROUPS={{ sf_toolbox_gitlab_client_groups | join(',') }}"
            create: true
            mode: "0644"
          when: sf_toolbox_gitlab_client_groups | default([]) | length > 0

        - name: Create the plugin directory
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.file:
            path: "{{ plugin_dir }}"
            state: directory
            mode: "0755"

        - name: Install the plugin files
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.copy:
            src: "omarchy-bar/plugin/{{ item }}"
            dest: "{{ plugin_dir }}/{{ item }}"
            mode: "0644"
          loop:
            - manifest.json
            - Toolbox.qml
            - MissionControl.qml
            - menu.json
            - sparkfabrik-logo.png
            - sparkfabrik-logo-white.png
          register: plugin_files

        # The pacman post-transaction hook touches this stamp file (as root);
        # the widget watches it and refreshes the packages row instantly.
        - name: Create the pacman stamp directory
          ansible.builtin.file:
            path: /var/lib/sparkfabrik-toolbox
            state: directory
            mode: "0755"

        - name: Create the pacman hooks directory
          ansible.builtin.file:
            path: /etc/pacman.d/hooks
            state: directory
            mode: "0755"

        - name: Install the pacman post-transaction hook
          ansible.builtin.copy:
            src: omarchy-bar/sparkfabrik-toolbox.hook
            dest: /etc/pacman.d/hooks/sparkfabrik-toolbox.hook
            mode: "0644"

        # Plugins cannot register Hyprland keybindings themselves, so the
        # shortcut goes into the user's own bindings.lua inside a marked block.
        # Users can change the combination there, or set the variable below.
        - name: Bind the Mission Control shortcut in Hyprland
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.blockinfile:
            path: "{{ system.home | default(current_home) }}/.config/hypr/bindings.lua"
            create: true
            mode: "0644"
            marker: "-- {mark} sparkfabrik.toolbox"
            block: |
              -- SparkFabrik Mission Control: your GitLab work at a glance.
              o.bind("{{ sf_toolbox_mission_control_key | default('CTRL + SUPER + ALT + S') }}", "Mission Control",
                "omarchy-shell -q shell summon sparkfabrik.toolbox '{}'")
          register: mission_control_bind

        - name: Reload Hyprland to pick up the shortcut
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.command: hyprctl reload
          when: mission_control_bind is changed
          changed_when: true
          failed_when: false

        - name: Check whether the widget is already in the bar layout
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.command: grep -q sparkfabrik.toolbox {{ system.home | default(current_home) }}/.config/omarchy/shell.json
          register: widget_enabled
          changed_when: false
          failed_when: false

        # omarchy-plugin-enable writes the user's shell.json, so it runs only
        # when the widget is not already placed, keeping repeat runs idempotent.
        - name: Enable the widget in the Omarchy bar
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.command: omarchy-plugin-enable sparkfabrik.toolbox --section right
          when: widget_enabled.rc != 0

        - name: Restart the Omarchy shell to load the widget
          become: true
          become_user: "{{ system.username | default(current_user) }}"
          ansible.builtin.command: omarchy-restart-shell
          when: widget_enabled.rc != 0 or plugin_files is changed
          failed_when: false
