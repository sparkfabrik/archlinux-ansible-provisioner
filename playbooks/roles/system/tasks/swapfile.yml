---
- name: Configure swapfile
  tags: [system, swapfile]
  when: swapfile.enabled | default(false)
  vars:
    swapfile_path: "{{ swapfile.btrfs_volume_mountpoint }}/{{ swapfile.filename }}"
    swapfile_size_bytes: "{{ swapfile.size | human_to_bytes }}"
  block:
    - name: Create a temporary mount point for the btrfs device
      ansible.builtin.file:
        path: "{{ swapfile.btrfs_temporary_mount_point }}"
        state: directory
        mode: "0755"

    - name: Mount the btrfs top-level volume
      ansible.builtin.command: mount -o noatime,compress=zstd,subvol=/ "{{ swapfile.btrfs_device }}" "{{ swapfile.btrfs_temporary_mount_point }}"
      changed_when: false

    - name: Check if the swap subvolume already exists
      ansible.builtin.command: btrfs subvolume show "{{ swapfile.btrfs_temporary_mount_point }}/{{ swapfile.btrfs_volume_name }}"
      register: btrfs_subvolume_exists
      changed_when: false
      failed_when: false

    - name: Create the btrfs swap subvolume
      when: btrfs_subvolume_exists.rc != 0
      ansible.builtin.command: btrfs subvolume create "{{ swapfile.btrfs_temporary_mount_point }}/{{ swapfile.btrfs_volume_name }}"

    - name: Unmount the btrfs top-level volume
      ansible.builtin.command: umount "{{ swapfile.btrfs_temporary_mount_point }}"
      changed_when: false

    - name: Create the mount point for the swap subvolume
      ansible.builtin.file:
        path: "{{ swapfile.btrfs_volume_mountpoint }}"
        state: directory
        mode: "0755"

    - name: Get the UUID of the btrfs device
      ansible.builtin.command: blkid -s UUID -o value "{{ swapfile.btrfs_device }}"
      register: btrfs_device_uuid
      changed_when: false

    - name: Add the swap subvolume to fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "UUID={{ btrfs_device_uuid.stdout }} {{ swapfile.btrfs_volume_mountpoint }} btrfs noatime,compress=zstd,subvol={{ swapfile.btrfs_volume_name }} 0 0"
        state: present
        create: true
        mode: "0644"

    - name: Mount all the devices in fstab
      ansible.builtin.command: mount -a
      changed_when: false

    - name: Inspect the swapfile
      ansible.builtin.stat:
        path: "{{ swapfile_path }}"
        # Only the size matters; a checksum would read the whole swapfile.
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: swapfile_stat

    - name: List active swap devices
      ansible.builtin.command: swapon --noheadings --raw --show=NAME,TYPE
      register: active_swaps
      changed_when: false

    # Recreating the swapfile changes its physical offset, which breaks resume
    # from hibernation until GRUB is updated, so only recreate on a size change.
    - name: Remove a swapfile whose size differs from the configured one
      when: swapfile_stat.stat.exists and (swapfile_stat.stat.size | int) != (swapfile_size_bytes | int)
      block:
        - name: Turn off the swapfile before resizing it
          when: swapfile_path in active_swaps.stdout_lines | map('split') | map('first') | list
          ansible.builtin.command: swapoff "{{ swapfile_path }}"

        - name: Delete the swapfile before resizing it
          ansible.builtin.file:
            path: "{{ swapfile_path }}"
            state: absent

    - name: Create the swapfile
      when: not swapfile_stat.stat.exists or (swapfile_stat.stat.size | int) != (swapfile_size_bytes | int)
      ansible.builtin.command: btrfs filesystem mkswapfile --size "{{ swapfile.size }}" --uuid clear "{{ swapfile_path }}"
      register: swapfile_created

    - name: Activate the swapfile
      when: swapfile_created is changed or swapfile_path not in (active_swaps.stdout_lines | map('split') | map('first') | list)
      ansible.builtin.command: swapon "{{ swapfile_path }}"

    - name: Add the swapfile to fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "{{ swapfile_path }} none swap defaults 0 0"
        state: present
        create: true
        mode: "0644"

    # A swap partition outside the encrypted root stores memory, and the
    # hibernation image, in clear. Turning it off is safe; wiping it is left to
    # the operator because it destroys data. zram and dm-crypt swap are not
    # clear-text partitions, so they are left alone.
    - name: Disable swap partitions
      when: swapfile.disable_swap_partitions | default(false)
      block:
        # GRUB keeps resume on the swap partition unless hibernation moves to
        # the swapfile, so disabling the partition alone would break resume.
        - name: Require hibernation on the swapfile
          ansible.builtin.assert:
            that: swapfile.configure_hibernate | default(false)
            fail_msg: "`swapfile.disable_swap_partitions` requires `swapfile.configure_hibernate: true`"

        - name: Turn off active swap partitions
          ansible.builtin.command: swapoff "{{ item.split()[0] }}"
          loop: "{{ active_swaps.stdout_lines | select('search', '\\spartition$') | reject('search', '^/dev/(zram|dm-|mapper/)') | list }}"

        - name: Comment out swap partitions in fstab
          ansible.builtin.replace:
            path: /etc/fstab
            regexp: '^((?:UUID=|PARTUUID=|LABEL=|PARTLABEL=|/dev/(?!zram|dm-|mapper/))\S+\s+\S+\s+swap\s.*)$'
            replace: '# Disabled by the swapfile role: \1'

    - name: Configure hibernation to use the swapfile
      when: swapfile.configure_hibernate | default(false)
      block:
        - name: Get the UUID of the filesystem holding the swapfile
          ansible.builtin.command: findmnt -no UUID -T "{{ swapfile_path }}"
          register: swapfile_uuid
          changed_when: false

        - name: Get the swapfile offset
          ansible.builtin.command: btrfs inspect-internal map-swapfile -r "{{ swapfile_path }}"
          register: swapfile_offset
          changed_when: false

        - name: Remove resume settings written to mkinitcpio.conf by older versions
          ansible.builtin.lineinfile:
            path: /etc/mkinitcpio.conf
            regexp: "{{ item }}"
            state: absent
          loop:
            - "^# Resume from hibernation using swapfile$"
            - "^resume="
            - "^resume_offset="
          register: mkinitcpio_cleanup

        - name: Regenerate the initramfs
          when: mkinitcpio_cleanup is changed
          ansible.builtin.command: mkinitcpio -P

        - name: Point the GRUB resume parameters at the swapfile
          ansible.builtin.replace:
            path: /etc/default/grub
            regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=".*?)resume=[^\s"]+(?:\s+resume_offset=[^\s"]+)?'
            replace: '\1resume=UUID={{ swapfile_uuid.stdout }} resume_offset={{ swapfile_offset.stdout }}'
          register: grub_resume_replaced

        - name: Add the GRUB resume parameters when missing
          ansible.builtin.lineinfile:
            path: /etc/default/grub
            regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="((?!.*resume=).*)"$'
            line: 'GRUB_CMDLINE_LINUX_DEFAULT="\1 resume=UUID={{ swapfile_uuid.stdout }} resume_offset={{ swapfile_offset.stdout }}"'
            backrefs: true
          register: grub_resume_added

        - name: Regenerate the GRUB configuration
          when: grub_resume_replaced is changed or grub_resume_added is changed
          ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg

        - name: Remove the logind environment written to logind.conf by older versions
          ansible.builtin.lineinfile:
            path: /etc/systemd/logind.conf
            regexp: "{{ item }}"
            state: absent
          loop:
            - '^\[Service\]$'
            - "^Environment=SYSTEMD_BYPASS_HIBERNATION_MEMORY_CHECK=1$"

        # The swapfile can be smaller than RAM, so let logind offer hibernation
        # anyway. Applied at the next boot; restarting logind ends user sessions.
        - name: Create the systemd-logind drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/systemd-logind.service.d
            state: directory
            mode: "0755"

        - name: Bypass the logind hibernation memory check
          ansible.builtin.copy:
            dest: /etc/systemd/system/systemd-logind.service.d/hibernation.conf
            mode: "0644"
            content: |
              [Service]
              Environment=SYSTEMD_BYPASS_HIBERNATION_MEMORY_CHECK=1
          register: logind_dropin

        - name: Reload systemd units
          when: logind_dropin is changed
          ansible.builtin.systemd:
            daemon_reload: true
