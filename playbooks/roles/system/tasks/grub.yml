---
- name: Configure grub
  tags: [system, grub]
  block:
    - stat: path=/boot/grub
      register: grubcfg

    - name: Read the current GRUB defaults
      ansible.builtin.slurp:
        src: /etc/default/grub
      register: grub_defaults

    # With hibernation on a swapfile, swapfile.yml owns the resume parameters;
    # keep them instead of pointing resume back at a swap partition.
    - name: Choose the GRUB resume parameters
      vars:
        grub_current_resume: "{{ grub_defaults.content | b64decode | regex_findall('^GRUB_CMDLINE_LINUX_DEFAULT=.*?(resume=[^\\s\"]+(?:\\s+resume_offset=[^\\s\"]+)?)', multiline=True) | first | default('') }}"
        grub_keep_resume: "{{ (swapfile.enabled | default(false)) and (swapfile.configure_hibernate | default(false)) and (grub_current_resume | length > 0) }}"
      ansible.builtin.set_fact:
        grub_resume: "{{ grub_current_resume if grub_keep_resume | bool else 'resume=PARTLABEL=swap' }}"
        grub_cmdline_extra: "{{ (' ' + system.grub.cmdline_extra) if (system.grub.cmdline_extra | default('')) else '' }}"

    - name: Set the GRUB_GFXMODE
      replace:
        path: /etc/default/grub
        regexp: "^GRUB_GFXMODE=.*$"
        replace: GRUB_GFXMODE={{ system.grub.gfxmode | default('auto') }}

    - name: Enable OS_PROBER
      lineinfile:
        dest: /etc/default/grub
        line: GRUB_DISABLE_OS_PROBER=false
        mode: 0644
        backup: yes

    - name: Enable GRUB recovery mode GRUB_DISABLE_RECOVERY
      lineinfile:
        dest: /etc/default/grub
        line: GRUB_DISABLE_RECOVERY=false
        mode: 0644
        backup: yes

    - name: Disable the GRUB EFI BootNext menu entries
      ansible.builtin.lineinfile:
        dest: /etc/default/grub
        regexp: "^#?GRUB_DISABLE_BOOTNEXT="
        line: GRUB_DISABLE_BOOTNEXT=true
        mode: "0644"
        backup: true

    - name: Remember last choice
      lineinfile:
        dest: /etc/default/grub
        line: GRUB_DEFAULT=saved
        mode: 0644
        backup: yes
        backrefs: yes
        regexp: "^GRUB_DEFAULT="

    - name: Grus save default
      lineinfile:
        dest: /etc/default/grub
        line: GRUB_SAVEDEFAULT=true
        mode: 0644
        backup: yes
        backrefs: yes
        regexp: "^GRUB_SAVEDEFAULT="

    - name: "Configuring GRUB cmdline"
      lineinfile:
        dest: /etc/default/grub
        regexp: "^GRUB_CMDLINE_LINUX_DEFAULT="
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="loglevel=2 quiet splash {{ grub_resume }}{{ grub_cmdline_extra }}"'
        mode: 0644
        backup: yes

    - name: "Regenerate GRUB config"
      command: grub-mkconfig -o /boot/grub/grub.cfg
      when: grubcfg.stat.isdir is defined and grubcfg.stat.isdir
