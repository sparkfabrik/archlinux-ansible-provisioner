---
# SparkFabrik Linux Toolbox — Company tooling playbook
#
# Installs only the shared SparkFabrik dev tools (sparkdock, AI, glab, gcloud,
# http-proxy). Does NOT provision the full system (no desktop, drivers, kernel).
#
# Usage:
#   sudo ansible-playbook playbooks/sf-toolbox.yml -i localhost, -c local
#   sudo ansible-playbook playbooks/sf-toolbox.yml -i localhost, -c local --tags ai,glab

- hosts: all
  vars:
    sparkdock_default_path: "{{ current_home }}/.local/spark/sparkdock"
    sparkfabrik: true

  # The mise shims carry the tools mise provides, which on Omarchy includes the
  # Node.js runtime and the npm-backed tools this playbook registers. Scripts
  # run from here look tools up on PATH (caveman's setup.sh needs node,
  # ai.yml needs openspec), and root's PATH has none of them. Appended last,
  # as Omarchy does, so a user's mise tools never shadow system binaries for
  # the tasks that run as root.
  environment:
    PATH: "{{ current_home | default('') }}/.local/bin:/home/linuxbrew/.linuxbrew/bin:{{ lookup('env', 'PATH') }}:{{ current_home | default('') }}/.local/share/mise/shims"

  pre_tasks:
    - name: Auto-detect current user
      tags: [always]
      ansible.builtin.set_fact:
        current_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"
        current_home: "/home/{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"

    # The sparkdock and sf-toolbox roles assume a base dev environment is
    # already present (on full workstation installs it is provided by the
    # `packages` role). On a minimal Arch base these commands are missing,
    # which made the playbook fail mid-run instead of up-front:
    #   - gum            -> sparkdock "Run agent resources sync"
    #   - zsh            -> sparkdock oh-my-zsh setup
    #   - nodejs, npm    -> sf-toolbox "Install npm packages"
    # (the oh-my-zsh shasum failure is fixed in sparkdock via a sha256sum
    #  fallback; coreutils is always present, so no perl/shasum dependency.)
    # These run before the roles so the toolbox playbook is self-contained.
    - name: Ensure base runtime dependencies (Archlinux)
      community.general.pacman:
        name:
          - gum
          - nodejs-lts-krypton
          - npm
          - zsh
        state: present
      become: true
      when: ansible_facts['os_family'] == "Archlinux"
      tags: [always]

  roles:
    - sparkdock
    - sf-toolbox
