[defaults]
# Ansible warns on every run that it discovered /usr/bin/python3.X and that a
# later interpreter could change that choice. The playbooks run against the
# local machine and want whatever python3 the distribution ships, so the
# discovery is the wanted behavior and only the warning is noise. `auto_silent`
# keeps the discovery and drops the warning; it does not pin an interpreter.
interpreter_python = auto_silent
